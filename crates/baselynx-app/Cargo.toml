[package]
name = "baselynx"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true

# Released with dist (dist-workspace.toml); `publish = false` only keeps it off crates.io.
[package.metadata.dist]
dist = true

[package.metadata.wix]
upgrade-guid = "9B56414F-085F-4B90-875A-9120F6F81B00"
path-guid = "4C780C08-A65D-4BA6-97A0-921A440DD2AF"
license = false
eula = false

[[bin]]
name = "baselynx"
path = "src/main.rs"

[dependencies]
baselynx-core = { path = "../baselynx-core" }
gpui-kit = { version = "=0.9.1", features = ["tree-sitter", "tree-sitter-sql"] }
directories = "6"
uuid = { version = "1.29", features = ["v4"] }
serde_json = "1"
lsp-types = "0.97"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# The app icon at run time (src/app_icon.rs): the X11 window icon, the macOS Dock icon.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["tree-sitter", "tree-sitter-sql", "test-support"] }
postgresql_embedded = { version = "0.22", default-features = false, features = ["theseus", "tokio", "tls-rustls-ring"] }
tempfile = "3"
