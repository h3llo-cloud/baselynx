[package]
name = "baselynx-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
csv = "1.4"
directories = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
indexmap = { version = "2", features = ["serde"] }
k8s-openapi = { version = "0.29", features = ["latest"] }
kube = { version = "5", default-features = false, features = ["client", "config", "rustls-tls", "ring", "ws"] }
keyring = "4.2"
rusqlite = { version = "0.42", features = ["bundled", "backup", "column_decltype"] }
rust_xlsxwriter = { version = "0.102", features = ["constant_memory"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
tokio-util = "0.7"
uuid = { version = "1.29", features = ["v4", "serde"] }

[dev-dependencies]
calamine = "0.38"
postgresql_embedded = { version = "0.22", default-features = false, features = ["theseus", "tokio", "tls-rustls-ring"] }
tempfile = "3"
