[workspace]
members = ["crates/baselynx-core", "crates/baselynx-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A fast desktop client for PostgreSQL, with Kubernetes port-forwards, backups and guarded restores."
keywords = ["postgresql", "database", "client", "gui", "kubernetes"]
categories = ["database", "gui"]
publish = false

# Framework crates are optimised in debug builds so the UI renders at usable speed;
# application code stays in debug.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 4
